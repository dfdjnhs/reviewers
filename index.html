<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --bg: #f3f3f3;
            --border: 3px solid var(--black);
            --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--black); overflow-x: hidden; }
        header { padding: 40px 5%; border-bottom: var(--border); background: var(--white); display: flex; justify-content: space-between; align-items: center; }
        
        .admin-toggle { background: var(--black); color: var(--white); border: none; padding: 10px 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }

        section { margin: 50px 0; }
        .section-title { font-size: 2.5rem; font-weight: 900; margin-left: 5%; margin-bottom: 20px; text-transform: uppercase; }
        
        .scroll-container { display: flex; overflow-x: auto; padding: 20px 5%; gap: 20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .scroll-container::-webkit-scrollbar { display: none; }
        
        .card { flex: 0 0 auto; scroll-snap-align: start; background: var(--white); border: var(--border); padding: 12px; box-shadow: 6px 6px 0 var(--black); transition: 0.3s var(--ease); cursor: pointer; position: relative; }
        .card:hover { transform: translate(-4px, -4px); box-shadow: 10px 10px 0 var(--black); }
        .card:active { transform: scale(0.98); }

        .album-card { width: 250px; }
        .album-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border: var(--border); }
        .series-card { width: 230px; } 
        .series-card img { width: 100%; aspect-ratio: 11/16; object-fit: cover; border: var(--border); }
        
        .type-tag { font-size: 10px; font-weight: 900; text-transform: uppercase; background: var(--black); color: white; padding: 2px 6px; display: inline-block; margin-bottom: 8px; }
        
        .title-wrapper { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-top: 10px; overflow: hidden; }
        .score-box { background: var(--black); color: white; padding: 5px 8px; font-weight: 900; font-size: 0.9rem; border: 2px solid var(--black); flex-shrink: 0; }

        .scroll-text-container { overflow: hidden; white-space: nowrap; width: 100%; }
        .animate-text { display: inline-block; padding-left: 100%; animation: marquee 8s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        .artist-name { font-size: 0.85rem; font-weight: 700; opacity: 0.6; margin-top: 2px; }

 /* FIX 1: The Global Overlay must be fixed to the viewport */
  /* Update your existing overlay and modal styles with these specific lines */
#overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    overflow-y: auto;
    backdrop-filter: blur(8px);
    /* Add these two lines to force centering */
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: var(--white);
    border: var(--border);
    max-width: 850px;
    width: 90%;
    margin: 5% auto; /* Ensures it has space at top/bottom on mobile */
    padding: 25px;
    position: relative;
    box-shadow: 15px 15px 0 var(--black);
}

        .track-row { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 8px 0; font-size: 0.9rem; }
        
        .bg-shape { position: fixed; border: var(--border); z-index: -1; opacity: 0.15; pointer-events: none; }
        .circle { width: 400px; height: 400px; border-radius: 50%; top: 10%; left: -50px; animation: drift 5s ease-in-out infinite alternate; }
        .square { width: 400px; height: 400px; bottom: 5%; right: -30px; animation: rotateDrift 60s linear infinite; }

        @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(50px, 100px); } }
        @keyframes rotateDrift { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); color: var(--white); z-index: 4000; justify-content: center; align-items: center; flex-direction: column; }
        .loading-text { font-size: 2rem; font-weight: 900; letter-spacing: 5px; animation: blink 0.8s steps(2, start) infinite; }
        .loading-bar-container { width: 200px; height: 20px; border: 2px solid var(--white); margin-top: 20px; padding: 2px; }
        .loading-bar-fill { height: 100%; background: var(--white); width: 0%; }
        @keyframes progress { to { width: 100%; } }
        @keyframes blink { to { opacity: 0.3; } }

        #admin-drawer { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--black); color: var(--white); border-top: var(--border); padding: 20px; z-index: 3000; }
        .admin-content h3 { margin-bottom: 15px; font-weight: 900; }
        .admin-content input, .admin-content textarea, .admin-content select { background: #222; color: white; border: 1px solid #444; padding: 10px; margin-bottom: 10px; width: 100%; font-family: 'Inter', sans-serif; }
        .admin-btns { display: flex; gap: 10px; }
        
        .cat-btn { flex: 1; background: var(--white); color: var(--black); border: none; padding: 40px 20px; font-weight: 900; font-size: 1rem; cursor: pointer; text-transform: uppercase; transition: 0.2s var(--ease); }
        .cat-btn:hover { background: #22c55e; transform: translateY(-5px); }

        .track-input-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; background: #111; padding: 5px; }
        .track-input-row input { background: #333 !important; }
        .delete-btn { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; border: 2px solid var(--black); width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; z-index: 10; }
/* Special Styling for Elite Albums */
.elite-card {
    background-color: #fde047 !important; /* Bright Yellow */
    background-image: radial-gradient(var(--black) 1px, transparent 0);
    background-size: 15px 15px; /* Creates the "Star/Texture" feel */
    border: 4px solid var(--black) !important;
    transform: rotate(-1deg); /* Slight tilt to make it stand out */
}

.elite-card .score-box {
    background: var(--black) !important;
    color: #fde047 !important;
    box-shadow: none;
}

/* Optional: Subtle pulse animation for Elite cards */
@keyframes elite-glow {
    from { box-shadow: 6px 6px 0 var(--black); }
    to { box-shadow: 12px 12px 0 var(--black); }
}
.elite-card:hover {
    animation: elite-glow 0.5s infinite alternate;
}
/* Apply Elite styling to Modals when active */
.modal-content.elite-modal {
    background-color: #fde047 !important;
    background-image: radial-gradient(var(--black) 1px, transparent 0);
    background-size: 20px 20px;
    border: 6px solid var(--black) !important;
}

.elite-modal h1, .elite-modal h2, .elite-modal h3 {
    color: var(--black);
}

/* Make the modal track rows look cleaner on yellow */
.elite-modal .track-row {
    border-bottom: 1px solid rgba(0,0,0,0.2);
}
.rank-row {
    display: flex;
    align-items: center;
    background: var(--white);
    border: var(--border);
    padding: 15px;
    gap: 20px;
    box-shadow: 4px 4px 0 var(--black);
    transition: 0.2s var(--ease);
}
.rank-row:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--black); }

.rank-number {
    font-size: 1.5rem;
    font-weight: 900;
    width: 40px;
    font-style: italic;
}

.rank-img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border: 2px solid var(--black);
}

.rank-info { flex: 1; }
.rank-info h4 { font-weight: 900; text-transform: uppercase; line-height: 1; }
.rank-info p { font-size: 0.8rem; opacity: 0.6; font-weight: 700; }
.nav-btn {
    background: none;
    border: none;
    font-weight: 900;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 0.75rem;
    opacity: 0.5;
    padding-bottom: 2px;
}
.nav-btn.active {
    opacity: 1;
    border-bottom: 3px solid var(--black);
}
/* Champion Blue Theme (#1 Spot) */
.champion-card {
    background-color: #2563eb !important; /* Electric Blue */
    background-image: 
        linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.1) 75%, transparent 75%, transparent);
    background-size: 50px 50px;
    border: 4px solid var(--black) !important;
    position: relative;
    animation: blue-shimmer 3s linear infinite;
}

/* The Shining Scanline Effect */
.champion-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-25deg);
    animation: shine-sweep 3s infinite;
    pointer-events: none;
}

@keyframes blue-shimmer {
    0% { background-position: 0 0; }
    100% { background-position: 50px 50px; }
}

/* Ensure text and boxes pop on Blue */
.champion-card .item-title, .champion-card .artist-name { color: white !important; }
.champion-card .score-box { 
    background: white !important; 
    color: #2563eb !important; 
    border-color: var(--black) !important;
}

/* Expanded Modal for Champion */
.champion-modal {
        background-color: #1e40af !important;
        background-image: linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%);
        background-size: 40px 40px;
        color: white !important;
        border: 8px solid var(--black) !important;
        overflow: hidden; /* CRITICAL: Clips the shine sweep */
    }
.champion-modal h1, .champion-modal h2, .champion-modal h3 { color: white !important; }
.champion-modal .track-row { border-bottom: 1px solid rgba(255,255,255,0.2); }
.champion-modal::after {
    content: '';
    position: absolute;
    top: 0; 
    left: -100vw; /* Use viewport width instead of % */
    width: 50vw;
    height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
    transform: skewX(-20deg);
    animation: modal-shine-sweep 3s infinite;
    pointer-events: none;
    z-index: 1;
}

@keyframes modal-shine-sweep {
    0% { transform: translateX(-100vw) skewX(-20deg); }
    100% { transform: translateX(200vw) skewX(-20deg); }
}


    /* Keep content visible above the shine */
    .champion-modal > * { position: relative; z-index: 2; }
    /* UPCOMING SECTION STYLES */
#upcoming-section { margin-top: 50px; }
.upcoming-card { 
    flex: 0 0 auto; /* Prevents shrinking/growing */
    width: 200px;  /* Define a set width like your other cards */
    filter: grayscale(1) contrast(0.8); 
    opacity: 0.8; 
    border-style: dashed !important;
}

.upcoming-card img {
    width: 100%;
    aspect-ratio: 1/1; /* Keeps it a perfect square */

}

.upcoming-card:hover { filter: grayscale(0.5); opacity: 1; }

.timer-tag {

    border: 2px solid var(--black);

}


/* Status Selectors in Admin */
.status-nav { display: flex; gap: 10px; margin-bottom: 15px; }
.status-btn { 
    flex: 1; background: #222; color: white; border: 1px solid #444;

}

            <div id="album-only-fields" style="display:none;">

<script type="module">
    import { albums as initialAlbums, cinema as initialCinema } from './data.js';

    // 1. Initialize Data
    let localAlbums = JSON.parse(localStorage.getItem('vault_albums')) || [];
    let localCinema = JSON.parse(localStorage.getItem('vault_cinema')) || [];
    let localUpcoming = JSON.parse(localStorage.getItem('vault_upcoming')) || [];
    
    // Combine for global use
    let allAlbums = [...initialAlbums, ...localAlbums];
    let allCinema = [...initialCinema, ...localCinema];

    window.currentCategory = 'album';
    window.currentStatus = 'reviewed';

    // 2. Utility Functions
    const getTopId = (data) => {
        if (!data || !data.length) return null;
        return [...data].sort((a, b) => parseFloat(b.score) - parseFloat(a.score))[0].id;
    };

    function getScoreColor(scoreStr) {
        const s = parseFloat(scoreStr);
        if (s >= 90) return "#22c55e";
        if (s >= 70) return "#eab308";
        return "#ef4444";
    }

    function getRemainingTime(targetDate) {
    const diff = new Date(targetDate).getTime() - new Date().getTime();
    
    // If the time has passed
    if (diff <= 0) return "RELEASING...";

    // Calculate time units
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((diff % (1000 * 60)) / 1000);

    // Format with leading zeros for a cleaner look
    const d = String(days).padStart(2, '0');
    const h = String(hours).padStart(2, '0');
    const m = String(mins).padStart(2, '0');
    const s = String(secs).padStart(2, '0');

    // Return the new format
    return `${d}D ${h}H ${m}M ${s}S`;
}


    // 3. Navigation
    window.showPage = function(pageId) {
        document.querySelectorAll('.page-view').forEach(p => p.style.display = 'none');
        document.getElementById('page-' + pageId).style.display = 'block';
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        if(document.getElementById('nav-' + pageId)) document.getElementById('nav-' + pageId).classList.add('active');

        if (pageId === 'home') render();
        if (pageId === 'rank-albums') renderSpecificRankings('album');
        if (pageId === 'rank-series') renderSpecificRankings('cinema');
    };

    // 4. Timer Logic
    function checkExpiringTimers() {
    let changed = false;
    const now = new Date().getTime();

    localUpcoming = localUpcoming.filter(item => {
        if (item.releaseDate && new Date(item.releaseDate).getTime() <= now) {
            // Ensure data maps correctly during promotion
            if (item.type === 'ALBUM') {
                // Critical: Ensure sub-info maps to 'artist'
                item.artist = item.artist || item.subText || "Unknown Artist";
                localAlbums.push(item);
            } else {
                item.cast = item.cast || item.subText || "N/A";
                localCinema.push(item);
            }
            changed = true;
            return false;
        }
        return true;
    });

    if (changed) {
        localStorage.setItem('vault_albums', JSON.stringify(localAlbums));
        localStorage.setItem('vault_cinema', JSON.stringify(localCinema));
        localStorage.setItem('vault_upcoming', JSON.stringify(localUpcoming));
        location.reload();
    }
}


    // 5. Main Render
    function render() {
        checkExpiringTimers();
        
        // Refresh combined lists
        allAlbums = [...initialAlbums, ...localAlbums];
        allCinema = [...initialCinema, ...localCinema];

        const topAlbumId = getTopId(allAlbums);
        const topCinemaId = getTopId(allCinema);

        // Render Upcoming
        // Render Upcoming
const upcomingList = document.getElementById('upcoming-list');
if (localUpcoming.length > 0) {
    document.getElementById('upcoming-section').style.display = 'block';
    upcomingList.innerHTML = localUpcoming.map(u => `
        <div class="card upcoming-card" style="width:200px;" onclick="openModal('${u.id}', 'upcoming')">
            <div class="delete-btn" onclick="deleteEntry(event, '${u.id}', 'upcoming')">X</div>
            <div class="timer-tag">${getRemainingTime(u.releaseDate)}</div>
            <span class="type-tag">${u.type}</span>
            <img src="${u.img}">
            <div class="title-wrapper">
                <div class="scroll-text-container">
                    <h3>${u.title}</h3>
                </div>
            </div>
        </div>`).join('');
} else {
    document.getElementById('upcoming-section').style.display = 'none';
}


        // Render Albums
        document.getElementById('album-list').innerHTML = allAlbums.map(a => {
            const isTop = a.id === topAlbumId;
            const isElite = parseFloat(a.score) >= 94;
            const cardClass = isTop ? 'champion-card' : (isElite ? 'elite-card' : '');
            return `
                <div class="card album-card ${cardClass}" onclick="openModal('${a.id}', 'album')">
                    <div class="delete-btn" onclick="deleteEntry(event, '${a.id}', 'album')">X</div>
                    <span class="type-tag">${isTop ? '🏆 NO. 1' : 'ALBUM'}</span>
                    <img src="${a.img}">
                    <div class="title-wrapper">
                        <div class="scroll-text-container">
                            <h3 class="item-title">${a.title}</h3>
                            <p class="artist-name">${a.artist || ''}</p>
                        </div>
                        <div class="score-box" style="background:${isTop ? 'white' : getScoreColor(a.score)}; color:${isTop ? '#2563eb' : 'white'}">${a.score}</div>
                    </div>
                </div>`;
        }).join('');

        // Render Cinema
        document.getElementById('series-list').innerHTML = allCinema.map(c => {
            const isTop = c.id === topCinemaId;
            const isElite = parseFloat(c.score) >= 94;
            const cardClass = isTop ? 'champion-card' : (isElite ? 'elite-card' : '');
            return `
                <div class="card series-card ${cardClass}" onclick="openModal('${c.id}', 'cinema')">
                    <div class="delete-btn" onclick="deleteEntry(event, '${c.id}', 'cinema')">X</div>
                    <span class="type-tag">${isTop ? '🏆 NO. 1' : 'CINEMA'}</span>
                    <img src="${c.poster || c.img}">
                    <div class="title-wrapper">
                        <div class="scroll-text-container">
                            <h3 class="item-title">${c.title}</h3>
                            <p class="artist-name">${c.cast || ''}</p>
                        </div>
                        <div class="score-box" style="background:${isTop ? 'white' : getScoreColor(c.score)}; color:${isTop ? '#2563eb' : 'white'}">${c.score}</div>
                    </div>
                </div>`;
        }).join('');
    }
    
window.exportVaultData = function() {
    const data = {
        albums: localStorage.getItem('vault_albums'),
        cinema: localStorage.getItem('vault_cinema'),
        singles: localStorage.getItem('vault_singles'),
        upcoming: localStorage.getItem('vault_upcoming')
    };
    
    const dataStr = JSON.stringify(data);
    const blob = new Blob([dataStr], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    
    const link = document.createElement('a');
    link.href = url;
    link.download = "the_vault_backup.json";
    link.click();
};

window.importVaultData = function() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    
    input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        
        reader.onload = readerEvent => {
            const content = JSON.parse(readerEvent.target.result);
            
            if(confirm("This will overwrite your current preview data. Proceed?")) {
                if(content.albums) localStorage.setItem('vault_albums', content.albums);
                if(content.cinema) localStorage.setItem('vault_cinema', content.cinema);
                if(content.singles) localStorage.setItem('vault_singles', content.singles);
                if(content.upcoming) localStorage.setItem('vault_upcoming', content.upcoming);
                
                alert("Import Successful! Reloading...");
                location.reload();
            }
        };
    };
    input.click();
};


    // 6. Ranking Page Render
    window.renderSpecificRankings = function(type) {
        const containerId = type === 'album' ? 'album-rank-container' : 'series-rank-container';
        const data = type === 'album' ? allAlbums : allCinema;
        const topId = getTopId(data);
        const sorted = [...data].sort((a, b) => parseFloat(b.score) - parseFloat(a.score));
        
        document.getElementById(containerId).innerHTML = sorted.map((item, index) => {
            const isTop = item.id === topId;
            const isElite = parseFloat(item.score) >= 94;
            const specialClass = isTop ? 'champion-card' : (isElite ? 'elite-card' : '');

            return `
                <div class="rank-row ${specialClass}">
                    <div class="rank-number">${isTop ? '👑' : '#' + (index + 1)}</div>
                    <img src="${item.img || item.poster}" class="rank-img">
                    <div class="rank-info">
                        <h4 style="font-weight:900;">${item.title}</h4>
                        <p>${item.artist || item.cast || ''}</p>
                    </div>
                    <div class="score-box" style="background:${isTop ? 'white' : getScoreColor(item.score)}; color:${isTop ? '#2563eb' : 'white'}">${item.score}</div>
                </div>
            `;
        }).join('');
    }

    // 7. Consolidated Modal Function
    window.openModal = function(id, type) {
        let item;
        const isUpcoming = type === 'upcoming';

        // Find the correct data source
        if (isUpcoming) {
            item = localUpcoming.find(i => i.id == id);
        } else {
            const data = type === 'album' ? allAlbums : allCinema;
            item = data.find(i => i.id == id);
        }
        
        if (!item) return; 
        
        const target = document.getElementById('modal-target');
        document.getElementById('overlay').scrollTop = 0;

        // Apply Styling Classes
        target.className = 'modal-content';
        if (!isUpcoming) {
            const data = type === 'album' ? allAlbums : allCinema;
            const topId = getTopId(data);
            if (item.id === topId) {
                target.classList.add('champion-modal');
            } else if (parseFloat(item.score) >= 94) {
                target.classList.add('elite-modal');
            }
        }

        // Generate Content
        target.innerHTML = `
            <div style="display:flex; gap:30px; flex-wrap:wrap; position:relative; z-index:5;">
                <div style="position:relative;">
                    <img src="${item.img || item.poster}" style="width:300px; aspect-ratio:${(type === 'cinema' || item.type === 'CINEMA') ? '11/16' : '1/1'}; object-fit:cover; border:var(--border); box-shadow: 10px 10px 0 var(--black);">
                </div>
                
                <div style="flex:1; min-width:300px;">
                    <div style="display:flex; justify-content:space-between; align-items: flex-start;">
                        <div>
                            <h1 style="font-size:3rem; line-height:0.9; margin-bottom:5px;">${item.title}</h1>
                            <h2 style="opacity:0.8; font-weight:700;">${item.artist || item.cast || ''}</h2>
                        </div>
                        ${!isUpcoming ? `
                            <div class="score-box" style="font-size:1.8rem; padding:10px 15px;">
                                ${item.score}
                            </div>
                        ` : `
                            <div class="score-box" style="background:#2563eb; color:white; font-size:0.8rem; padding:10px;">
                                LOCKED
                            </div>
                        `}
                    </div>

                    ${isUpcoming ? `
                        <div style="background:var(--black); color:white; padding:15px; border:var(--border); margin:20px 0; font-family:monospace; text-align:center;">
                            TRANSMISSION ARRIVING IN: <br>
                            <span style="font-size:1.5rem; font-weight:900;">${getRemainingTime(item.releaseDate)}</span>
                        </div>
                    ` : `
                        <div style="background:rgba(255,255,255,0.2); padding:20px; border:var(--border); margin:25px 0; font-weight:600; line-height:1.6;">
                            ${item.review || 'No review written yet.'}
                        </div>
                    `}

                    ${item.tracks && item.tracks.length > 0 ? `
                        <h3 style="border-bottom:var(--border); padding-bottom:5px; margin-bottom:15px; letter-spacing:2px; font-size:0.8rem;">
                            ${isUpcoming ? 'EXPECTED TRACKLIST' : 'TRACKLIST'}
                        </h3>
                        <div style="max-height: 250px; overflow-y: auto;">
                            ${item.tracks.map(t => `
                                <div class="track-row">
                                    <span style="font-weight:700;">${t.name}</span>
                                    <span style="font-family:monospace; opacity:0.8;">${isUpcoming ? '???' : t.rating}</span>
                                </div>`).join('')}
                        </div>
                    ` : ''}
                </div>
            </div>`;

        document.getElementById('overlay').style.display = 'flex';
        document.body.style.overflow = 'hidden'; 
    };

    document.getElementById('overlay').onclick = (e) => {
        if (e.target.id === 'overlay') {
            document.getElementById('overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    };

    // 8. Admin Drawer & Logic
    window.toggleDrawer = (show) => {
        document.getElementById('admin-drawer').style.display = show ? 'block' : 'none';
        if(!show) resetAdmin();
    };

    window.selectCategory = (cat) => {
        window.currentCategory = cat;
        document.getElementById('admin-step-1').style.display = 'none';
        document.getElementById('admin-step-2').style.display = 'block';
        document.getElementById('form-title').innerText = cat === 'album' ? 'NEW ALBUM' : 'NEW CINEMA';
        document.getElementById('album-only-fields').style.display = cat === 'album' ? 'block' : 'none';
    };

    window.setEntryStatus = (status) => {
        window.currentStatus = status;
        document.getElementById('stat-reviewed').classList.toggle('active', status === 'reviewed');
        document.getElementById('stat-upcoming').classList.toggle('active', status === 'upcoming');
        document.getElementById('timer-field').style.display = status === 'upcoming' ? 'block' : 'none';
        document.getElementById('entry-score').style.display = status === 'upcoming' ? 'none' : 'block';
    };

    window.resetAdmin = () => {
        document.getElementById('admin-step-1').style.display = 'block';
        document.getElementById('admin-step-2').style.display = 'none';
        document.querySelectorAll('#admin-drawer input, #admin-drawer textarea').forEach(i => i.value = '');
        document.getElementById('track-input-container').innerHTML = '';
        document.getElementById('live-avg').innerText = '0';
        window.setEntryStatus('reviewed');
    };

    window.addTrackInput = () => {
        const div = document.createElement('div');
        div.className = 'track-input-row';
        div.innerHTML = `<input type="text" placeholder="Track Name" style="flex:3;"><input type="number" placeholder="0" class="track-score" style="flex:1;" oninput="calculateAvg()">`;
        document.getElementById('track-input-container').appendChild(div);
    };

    window.calculateAvg = () => {
        const scores = Array.from(document.querySelectorAll('.track-score')).map(i => parseFloat(i.value)).filter(v => !isNaN(v));
        if (scores.length > 0) {
            const avg = (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
            document.getElementById('live-avg').innerText = avg;
            document.getElementById('entry-score').value = avg;
        }
    };

    document.getElementById('save-btn').onclick = () => {
        const title = document.getElementById('entry-title').value;
        const subText = document.getElementById('entry-sub').value;
        const score = document.getElementById('entry-score').value || 0;
        
        if (!title) return alert("Title required");

        const newEntry = {
            id: Date.now().toString(),
            title: title,
            img: document.getElementById('entry-img').value || 'https://via.placeholder.com/300',
            review: document.getElementById('entry-review').value || "No review written yet.",
            score: score,
            releaseDate: document.getElementById('release-date').value,
            type: window.currentCategory.toUpperCase(),
            tracks: Array.from(document.querySelectorAll('.track-input-row')).map(row => ({
                name: row.querySelectorAll('input')[0].value,
                rating: row.querySelectorAll('input')[1].value
            })).filter(t => t.name)
        };

        if (window.currentCategory === 'album') {
            newEntry.artist = subText;
        } else {
            newEntry.cast = subText;
            newEntry.poster = newEntry.img;
        }

        if (window.currentStatus === 'upcoming') {
            localUpcoming.push(newEntry);
            localStorage.setItem('vault_upcoming', JSON.stringify(localUpcoming));
        } else {
            if (window.currentCategory === 'album') {
                localAlbums.push(newEntry);
                localStorage.setItem('vault_albums', JSON.stringify(localAlbums));
            } else {
                localCinema.push(newEntry);
                localStorage.setItem('vault_cinema', JSON.stringify(localCinema));
            }
        }
        location.reload();
    };

    window.deleteEntry = (event, id, type) => {
        event.stopPropagation();
        if(!confirm("Erase entry?")) return;
        if(type === 'album') {
            localAlbums = localAlbums.filter(a => a.id !== id);
            localStorage.setItem('vault_albums', JSON.stringify(localAlbums));
        } else if (type === 'cinema') {
            localCinema = localCinema.filter(c => c.id !== id);
            localStorage.setItem('vault_cinema', JSON.stringify(localCinema));
        } else {
            localUpcoming = localUpcoming.filter(u => u.id !== id);
            localStorage.setItem('vault_upcoming', JSON.stringify(localUpcoming));
        }
        location.reload();
    };

    document.getElementById('open-admin').onclick = () => toggleDrawer(true);
    
    setInterval(() => {
        if(localUpcoming.length > 0) render();
    }, 1000);

    render();

</script>
</body>
