<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --bg: #f3f3f3;
            --border: 3px solid var(--black);
            --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--black); overflow-x: hidden; }
        header { padding: 40px 5%; border-bottom: var(--border); background: var(--white); display: flex; justify-content: space-between; align-items: center; }
        
        .admin-toggle { background: var(--black); color: var(--white); border: none; padding: 10px 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }

        section { margin: 50px 0; }
        .section-title { font-size: 2.5rem; font-weight: 900; margin-left: 5%; margin-bottom: 20px; text-transform: uppercase; }
        
        .scroll-container { display: flex; overflow-x: auto; padding: 20px 5%; gap: 20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .scroll-container::-webkit-scrollbar { display: none; }
        
        .card { flex: 0 0 auto; scroll-snap-align: start; background: var(--white); border: var(--border); padding: 12px; box-shadow: 6px 6px 0 var(--black); transition: 0.3s var(--ease); cursor: pointer; position: relative; }
        .card:hover { transform: translate(-4px, -4px); box-shadow: 10px 10px 0 var(--black); }
        .card:active { transform: scale(0.98); }

        .album-card { width: 250px; }
        .album-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border: var(--border); }
        .series-card { width: 230px; } 
        .series-card img { width: 100%; aspect-ratio: 11/16; object-fit: cover; border: var(--border); }
        
        .type-tag { font-size: 10px; font-weight: 900; text-transform: uppercase; background: var(--black); color: white; padding: 2px 6px; display: inline-block; margin-bottom: 8px; }
        
        .title-wrapper { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-top: 10px; overflow: hidden; }
        .score-box { background: var(--black); color: white; padding: 5px 8px; font-weight: 900; font-size: 0.9rem; border: 2px solid var(--black); flex-shrink: 0; }

        .scroll-text-container { overflow: hidden; white-space: nowrap; width: 100%; }
        .animate-text { display: inline-block; padding-left: 100%; animation: marquee 8s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        .artist-name { font-size: 0.85rem; font-weight: 700; opacity: 0.6; margin-top: 2px; }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal-content { background: var(--white); border: var(--border); max-width: 900px; margin: 40px auto; padding: 40px; position: relative; box-shadow: 15px 15px 0 var(--black); }
        .track-row { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 8px 0; font-size: 0.9rem; }
        
        .bg-shape { position: fixed; border: var(--border); z-index: -1; opacity: 0.15; pointer-events: none; }
        .circle { width: 400px; height: 400px; border-radius: 50%; top: 10%; left: -50px; animation: drift 5s ease-in-out infinite alternate; }
        .square { width: 400px; height: 400px; bottom: 5%; right: -30px; animation: rotateDrift 60s linear infinite; }

        @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(50px, 100px); } }
        @keyframes rotateDrift { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); color: var(--white); z-index: 4000; justify-content: center; align-items: center; flex-direction: column; }
        .loading-text { font-size: 2rem; font-weight: 900; letter-spacing: 5px; animation: blink 0.8s steps(2, start) infinite; }
        .loading-bar-container { width: 200px; height: 20px; border: 2px solid var(--white); margin-top: 20px; padding: 2px; }
        .loading-bar-fill { height: 100%; background: var(--white); width: 0%; }
        @keyframes progress { to { width: 100%; } }
        @keyframes blink { to { opacity: 0.3; } }

        #admin-drawer { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--black); color: var(--white); border-top: var(--border); padding: 20px; z-index: 3000; }
        .admin-content h3 { margin-bottom: 15px; font-weight: 900; }
        .admin-content input, .admin-content textarea, .admin-content select { background: #222; color: white; border: 1px solid #444; padding: 10px; margin-bottom: 10px; width: 100%; font-family: 'Inter', sans-serif; }
        .admin-btns { display: flex; gap: 10px; }
        
        .cat-btn { flex: 1; background: var(--white); color: var(--black); border: none; padding: 40px 20px; font-weight: 900; font-size: 1rem; cursor: pointer; text-transform: uppercase; transition: 0.2s var(--ease); }
        .cat-btn:hover { background: #22c55e; transform: translateY(-5px); }

        .track-input-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; background: #111; padding: 5px; }
        .track-input-row input { background: #333 !important; }
        .delete-btn { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; border: 2px solid var(--black); width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; z-index: 10; }
/* Special Styling for Elite Albums */
.elite-card {
    background-color: #fde047 !important; /* Bright Yellow */
    background-image: radial-gradient(var(--black) 1px, transparent 0);
    background-size: 15px 15px; /* Creates the "Star/Texture" feel */
    border: 4px solid var(--black) !important;
    transform: rotate(-1deg); /* Slight tilt to make it stand out */
}

.elite-card .score-box {
    background: var(--black) !important;
    color: #fde047 !important;
    box-shadow: none;
}

/* Optional: Subtle pulse animation for Elite cards */
@keyframes elite-glow {
    from { box-shadow: 6px 6px 0 var(--black); }
    to { box-shadow: 12px 12px 0 var(--black); }
}
.elite-card:hover {
    animation: elite-glow 0.5s infinite alternate;
}
/* Apply Elite styling to Modals when active */
.modal-content.elite-modal {
    background-color: #fde047 !important;
    background-image: radial-gradient(var(--black) 1px, transparent 0);
    background-size: 20px 20px;
    border: 6px solid var(--black) !important;
}

.elite-modal h1, .elite-modal h2, .elite-modal h3 {
    color: var(--black);
}

/* Make the modal track rows look cleaner on yellow */
.elite-modal .track-row {
    border-bottom: 1px solid rgba(0,0,0,0.2);
}
.rank-row {
    display: flex;
    align-items: center;
    background: var(--white);
    border: var(--border);
    padding: 15px;
    gap: 20px;
    box-shadow: 4px 4px 0 var(--black);
    transition: 0.2s var(--ease);
}
.rank-row:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--black); }

.rank-number {
    font-size: 1.5rem;
    font-weight: 900;
    width: 40px;
    font-style: italic;
}

.rank-img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border: 2px solid var(--black);
}

.rank-info { flex: 1; }
.rank-info h4 { font-weight: 900; text-transform: uppercase; line-height: 1; }
.rank-info p { font-size: 0.8rem; opacity: 0.6; font-weight: 700; }
.nav-btn {
    background: none;
    border: none;
    font-weight: 900;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 0.75rem;
    opacity: 0.5;
    padding-bottom: 2px;
}
.nav-btn.active {
    opacity: 1;
    border-bottom: 3px solid var(--black);
}

    </style>
    <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
    
</head>
<body>

<div class="bg-shape circle"></div>
<div class="bg-shape square"></div>

<div id="loader">
    <div class="loading-text">RETRIEVING DATA...</div>
    <div class="loading-bar-container">
        <div class="loading-bar-fill" id="fill"></div>
    </div>
</div>

<header>
    <div style="display:flex; flex-direction:column;">
        <h1 style="font-weight: 900; font-size: 3.5rem; letter-spacing: -3px;">THE VAULT.</h1>
<nav style="margin-top:10px; display:flex; gap:15px; overflow-x: auto; white-space: nowrap; padding-bottom: 5px;">
    <button onclick="showPage('home')" class="nav-btn" id="nav-home">ALBUMS</button>
    <button onclick="showPage('series')" class="nav-btn" id="nav-series">SERIES</button>
    <button onclick="showPage('rankings')" class="nav-btn" id="nav-rankings">RANKINGS</button>
</nav>

    </div>
    <button class="admin-toggle" id="open-admin">Add Entry</button>
</header>

<div id="page-home" class="page-view">
    <section>
        <h2 class="section-title">Albums</h2>
        <div class="scroll-container" id="album-list"></div>
    </section>
</div>

<div id="page-series" class="page-view" style="display:none;">
    <section>
        <h2 class="section-title">Series & Movies</h2>
        <div id="series-list" style="display: flex; flex-wrap: wrap; padding: 20px 5%; gap: 20px; justify-content: center;"></div>
    </section>
</div>

<div id="page-rankings" class="page-view" style="display:none; padding: 20px 5%;">
    <h2 class="section-title" style="margin-left:0;">GLOBAL RANKINGS</h2>
    <div id="rankings-container" style="display: flex; flex-direction: column; gap: 15px;"></div>
</div>


<div id="overlay">
    <div class="modal-content" id="modal-target"></div>
</div>

<div id="admin-drawer">
    <div class="admin-content">
        <div id="admin-step-1">
            <h3 style="text-align: center; margin-bottom: 20px;">SELECT CATEGORY</h3>
            <div style="display: flex; gap: 15px;">
                <button class="cat-btn" onclick="selectCategory('album')">ALBUMS / SONGS</button>
                <button class="cat-btn" onclick="selectCategory('cinema')">SERIES / TV</button>
            </div>
            <button id="close-admin" onclick="toggleDrawer(false)" style="width:100%; margin-top:15px; background:transparent; color:white; border:1px solid #444; padding:10px;">CANCEL</button>
        </div>

        <div id="admin-step-2" style="display: none;">
            <h3 id="form-title">NEW ENTRY</h3>
            <input type="text" id="entry-title" placeholder="TITLE...">
            <input type="text" id="entry-sub" placeholder="ARTIST / CAST...">
            <input type="text" id="entry-img" placeholder="IMAGE URL...">
            
            <div id="album-only-fields" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin: 10px 0;">
                    <h4 style="font-size:0.8rem; font-weight:900;">TRACKLIST</h4>
                    <button type="button" onclick="addTrackInput()" style="background:#22c55e; border:none; padding:5px 10px; font-weight:900; cursor:pointer;">+ ADD TRACK</button>
                </div>
                <div id="track-input-container" style="max-height: 200px; overflow-y: auto; margin-bottom:10px;"></div>
                <div style="background:#222; padding:10px; border:1px solid #444; margin-bottom:10px;">
                    <span style="font-size:0.7rem; opacity:0.6;">AUTO-CALCULATED AVG:</span>
                    <span id="live-avg" style="font-weight:900; color:#22c55e; float:right;">0</span>
                </div>
            </div>

            <input type="number" id="entry-score" placeholder="SCORE (0-100)" min="0" max="100">
            <textarea id="entry-review" placeholder="YOUR REVIEW / SUMMARY..."></textarea>
            
            <div class="admin-btns">
                <button id="save-btn" style="background: #22c55e; flex: 2; padding: 15px; font-weight: 900; border: none; cursor: pointer;">EXECUTE_UPLOAD</button>
                <button onclick="resetAdmin()" style="background: #444; flex: 1; border: none; color:white; font-weight: 900; cursor: pointer;">BACK</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { albums as initialAlbums, cinema as initialCinema } from './data.js';

    let localAlbums = JSON.parse(localStorage.getItem('vault_albums')) || [];
    let localCinema = JSON.parse(localStorage.getItem('vault_cinema')) || [];
    let allAlbums = [...initialAlbums, ...localAlbums];
    let allCinema = [...initialCinema, ...localCinema];
    let currentCategory = '';

    // --- UTILS ---
    function getScoreColor(scoreStr) {
        const s = parseFloat(scoreStr);
        if (s >= 90) return "#22c55e";
        if (s >= 70) return "#eab308";
        if (s >= 50) return "#f97316";
        return "#ef4444";
    }

    function showLoader(cb) {
        const loader = document.getElementById('loader');
        const fill = document.getElementById('fill');
        loader.style.display = 'flex';
        fill.style.width = '0%';
        fill.style.animation = 'none';
        void fill.offsetWidth; 
        fill.style.animation = 'progress 1.2s ease-in-out forwards';
        setTimeout(() => { loader.style.display = 'none'; cb(); }, 1200);
    }

    // --- ADMIN LOGIC ---
    window.toggleDrawer = (show) => {
        document.getElementById('admin-drawer').style.display = show ? 'block' : 'none';
        if(show) resetAdmin();
    };

    window.selectCategory = (cat) => {
        currentCategory = cat;
        document.getElementById('admin-step-1').style.display = 'none';
        document.getElementById('admin-step-2').style.display = 'block';
        const isAlb = cat === 'album';
        document.getElementById('album-only-fields').style.display = isAlb ? 'block' : 'none';
        document.getElementById('entry-score').readOnly = isAlb;
        document.getElementById('form-title').innerText = isAlb ? 'NEW ALBUM' : 'NEW CINEMA';
        if(isAlb) {
            document.getElementById('track-input-container').innerHTML = '';
            addTrackInput();
        }
    };

    window.addTrackInput = () => {
        const container = document.getElementById('track-input-container');
        const div = document.createElement('div');
        div.className = 'track-input-row';
        div.innerHTML = `
            <input type="text" class="t-name" placeholder="Name" oninput="calculateAvg()">
            <input type="number" class="t-score" placeholder="0-100" oninput="calculateAvg()">
            <label><input type="checkbox" class="t-exclude" onchange="calculateAvg()"><span>EXCL</span></label>
            <button onclick="this.parentElement.remove(); calculateAvg();" style="background:red; color:white; border:none; padding:5px;">X</button>
        `;
        container.appendChild(div);
    };

    window.calculateAvg = () => {
        if (currentCategory !== 'album') return;
        const rows = document.querySelectorAll('.track-input-row');
        let total = 0, count = 0;
        rows.forEach(r => {
            const s = parseFloat(r.querySelector('.t-score').value);
            const ex = r.querySelector('.t-exclude').checked;
            if (!isNaN(s) && !ex) { total += s; count++; }
        });
        const avg = count > 0 ? (total / count).toFixed(1) : 0;
        document.getElementById('live-avg').innerText = avg;
        document.getElementById('entry-score').value = avg;
    };

    window.resetAdmin = () => {
        document.getElementById('admin-step-1').style.display = 'block';
        document.getElementById('admin-step-2').style.display = 'none';
        document.querySelectorAll('#admin-step-2 input, #admin-step-2 textarea').forEach(i => i.value = '');
        document.getElementById('live-avg').innerText = '0';
    };

    document.getElementById('save-btn').onclick = () => {
        const newItem = {
            id: Date.now(),
            title: document.getElementById('entry-title').value,
            score: document.getElementById('entry-score').value,
            img: document.getElementById('entry-img').value || 'https://via.placeholder.com/300',
            review: document.getElementById('entry-review').value
        };

        if (currentCategory === 'album') {
            newItem.artist = document.getElementById('entry-sub').value;
            newItem.type = "ALBUM";
            newItem.tracks = Array.from(document.querySelectorAll('.track-input-row')).map(r => ({
                name: r.querySelector('.t-name').value,
                rating: r.querySelector('.t-score').value + "/100",
                excluded: r.querySelector('.t-exclude').checked
            }));
            localAlbums.push(newItem);
            localStorage.setItem('vault_albums', JSON.stringify(localAlbums));
            allAlbums.push(newItem);
        } else {
            newItem.cast = document.getElementById('entry-sub').value;
            newItem.poster = newItem.img;
            newItem.type = "CINEMA";
            localCinema.push(newItem);
            localStorage.setItem('vault_cinema', JSON.stringify(localCinema));
            allCinema.push(newItem);
        }
        render();
        toggleDrawer(false);
    };

    // --- CORE LOGIC ---
    window.deleteEntry = (e, id, type) => {
        e.stopPropagation();
        if (!confirm("Delete?")) return;
        if (type === 'album') {
            allAlbums = allAlbums.filter(a => a.id != id);
            localAlbums = localAlbums.filter(a => a.id != id);
            localStorage.setItem('vault_albums', JSON.stringify(localAlbums));
        } else {
            allCinema = allCinema.filter(c => c.id != id);
            localCinema = localCinema.filter(c => c.id != id);
            localStorage.setItem('vault_cinema', JSON.stringify(localCinema));
        }
        render();
    };
// --- PAGE SWITCHING ---
window.showPage = function(pageId) {
    // Hide all pages
    document.querySelectorAll('.page-view').forEach(p => p.style.display = 'none');
    
    // Show selected page
    const activePage = pageId === 'home' ? 'page-home' : 
                       pageId === 'series' ? 'page-series' : 'page-rankings';
    document.getElementById(activePage).style.display = 'block';
    
    // Update Nav UI
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('nav-' + pageId).classList.add('active');

    // Special renders
    if (pageId === 'rankings') renderRankings();
};


// --- RENDER RANKINGS ---
function renderRankings() {
    const container = document.getElementById('rankings-container');
    
    // Combine both lists and sort by score descending
    const allItems = [...allAlbums, ...allCinema].sort((a, b) => parseFloat(b.score) - parseFloat(a.score));
    
    container.innerHTML = allItems.map((item, index) => {
        const isElite = parseFloat(item.score) >= 94;
        const scoreColor = getScoreColor(item.score);
        
        return `
            <div class="rank-row ${isElite ? 'elite-card' : ''}" onclick="openModal('${item.id}', '${item.type === 'ALBUM' ? 'album' : 'cinema'}')">
                <div class="rank-number">#${index + 1}</div>
                <img src="${item.img || item.poster}" class="rank-img">
                <div class="rank-info">
                    <h4>${item.title}</h4>
                    <p>${item.artist || item.cast || ''} • ${item.type}</p>
                </div>
                <div class="score-box" style="background:${scoreColor}">${item.score}</div>
            </div>
        `;
    }).join('');
}

// Ensure renderRankings is called whenever a new entry is saved
const originalSave = document.getElementById('save-btn').onclick;
document.getElementById('save-btn').onclick = () => {
    originalSave(); // Execute existing save logic
    if (document.getElementById('page-rankings').style.display === 'block') {
        renderRankings();
    }
};

            function render() {
        // Render Albums
        document.getElementById('album-list').innerHTML = allAlbums.map(a => {
            const isElite = parseFloat(a.score) >= 94;
            return `
                <div class="card album-card ${isElite ? 'elite-card' : ''}" data-id="${a.id}">
                    <div class="delete-btn" onclick="deleteEntry(event, '${a.id}', 'album')">X</div>
                    <span class="type-tag">ALBUM</span>
                    <img src="${a.img}">
                    <div class="title-wrapper">
                        <div class="scroll-text-container">
                            <h3 class="item-title" style="font-weight:900;">${a.title}</h3>
                            <p class="artist-name">${a.artist}</p>
                        </div>
                        <div class="score-box" style="background:${getScoreColor(a.score)}">${a.score}</div>
                    </div>
                </div>
            `;
        }).join('');

        // Render Cinema
        document.getElementById('series-list').innerHTML = allCinema.map(c => {
    const isElite = parseFloat(c.score) >= 94;
    return `
        <div class="card series-card ${isElite ? 'elite-card' : ''}" data-id="${c.id}" style="width: 160px; flex: 0 0 auto;">
            <div class="delete-btn" onclick="deleteEntry(event, '${c.id}', 'cinema')">X</div>
            <span class="type-tag">CINEMA</span>
            <img src="${c.poster || c.img}" style="height: 220px;">
            <div class="title-wrapper">
                <div class="scroll-text-container">
                    <h3 class="item-title" style="font-size: 0.8rem; font-weight:900;">${c.title}</h3>
                </div>
                <div class="score-box" style="background:${getScoreColor(c.score)}; font-size: 0.7rem; padding: 3px 5px;">${c.score}</div>
            </div>
        </div>
    `;
}).join('');


        // Re-attach click events
        document.querySelectorAll('.card').forEach(card => {
            card.onclick = (e) => {
                if(!e.target.classList.contains('delete-btn')) 
                    openModal(card.dataset.id, card.classList.contains('album-card') ? 'album' : 'cinema');
            };
        });
    }


        function openModal(id, type) {
        const item = type === 'album' ? allAlbums.find(a => a.id == id) : allCinema.find(c => c.id == id);
        if(!item) return;

        showLoader(() => {
            const target = document.getElementById('modal-target');
            const isElite = parseFloat(item.score) >= 94;
            
            // Toggle Elite class on the modal container itself
            target.className = 'modal-content' + (isElite ? ' elite-modal' : '');
            
            if(type === 'album') {
                target.innerHTML = `
                    <div style="display:flex; gap:30px; flex-wrap:wrap;">
                        <img src="${item.img}" style="width:300px; aspect-ratio:1/1; object-fit:cover; border:var(--border); box-shadow: 10px 10px 0 var(--black);">
                        <div style="flex:1; min-width:300px;">
                            <div style="display:flex; justify-content:space-between; align-items: flex-start;">
                                <div><h1 style="font-size:3rem; line-height:0.9;">${item.title}</h1><h2 style="opacity:0.7;">${item.artist}</h2></div>
                                <div class="score-box" style="background:${getScoreColor(item.score)}; font-size:1.5rem; padding:10px 15px;">${item.score}</div>
                            </div>
                            <p style="background:rgba(255,255,255,0.5); padding:15px; border:var(--border); margin:20px 0; font-weight:700;">${item.review || 'No review added.'}</p>
                            <h3 style="border-bottom:var(--border); padding-bottom:5px; margin-bottom:10px;">TRACKLIST</h3>
                            <div style="max-height: 250px; overflow-y: auto;">
                                ${item.tracks ? item.tracks.map(t => `<div class="track-row"><span>${t.name}</span><strong>${t.rating}</strong></div>`).join('') : ''}
                            </div>
                        </div>
                    </div>`;
            } else {
                target.innerHTML = `
                    <div style="display:flex; gap:30px; flex-wrap:wrap;">
                        <img src="${item.poster || item.img}" style="width:300px; aspect-ratio:11/16; object-fit:cover; border:var(--border); box-shadow: 10px 10px 0 var(--black);">
                        <div style="flex:1; min-width:300px;">
                            <div style="display:flex; justify-content:space-between; align-items: flex-start;">
                                <h1 style="font-size:3rem; line-height:0.9;">${item.title}</h1>
                                <div class="score-box" style="background:${getScoreColor(item.score)}; font-size:1.5rem; padding:10px 15px;">${item.score}</div>
                            </div>
                            <p style="margin: 10px 0;"><strong>CAST:</strong> ${item.cast || 'N/A'}</p>
                            <div style="background:var(--black); color:white; padding:25px; margin-top:20px; border:var(--border);">
                                <h3 style="color:white; font-size:0.7rem; letter-spacing:2px; margin-bottom:10px; opacity:0.6;">REVIEW SUMMARY</h3>
                                <p style="font-style:italic; line-height:1.6;">"${item.review || 'No critique recorded.'}"</p>
                            </div>
                        </div>
                    </div>`;
            }
            document.getElementById('overlay').style.display = 'block';
        });
    }


    document.getElementById('open-admin').onclick = () => toggleDrawer(true);
    document.getElementById('overlay').onclick = (e) => { if(e.target.id === 'overlay') e.target.style.display = 'none'; };

    render();
</script>
</body>
</html>
